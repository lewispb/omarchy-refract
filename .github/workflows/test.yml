name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the bridge test suite
        run: python -m unittest discover -s bridge/tests -v
